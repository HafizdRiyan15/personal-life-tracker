<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Personal Life Tracker</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="auth-layout">
        <section class="auth-side">
            <a href="../index.html" class="brand">
                <span class="brand-icon">✦</span>
                Personal Life Tracker
            </a>
            <h1>Kenali dirimu. Atur langkahmu.</h1>
            <p>
                Kelola kebiasaan, jurnal, target, dan keuangan pribadi
                dalam satu tempat.
            </p>
            <a href="../index.html" class="muted-text">← Kembali ke halaman utama</a>
        </section>

        <section class="auth-main">
            <div class="auth-card">
                <h2 id="formTitle">Selamat datang!</h2>
                <p class="muted-text" id="formDescription">Masuk untuk melanjutkan perjalananmu.</p>

                <div class="app-nav">
                    <a href="#" id="loginTab">Masuk</a>
                    <a href="#" id="registerTab">Buat Akun</a>
                </div>

                <form id="authForm">
                    <div class="form-group" id="nameGroup" hidden>
                        <label for="fullName">Nama</label>
                        <input id="fullName" type="text" autocomplete="name" placeholder="Nama kamu">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" type="email" autocomplete="email" required placeholder="nama@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Minimal 6 karakter">
                    </div>

                    <button class="full-width" id="submitButton" type="submit">Masuk</button>
                </form>

                <div id="authMessage" class="notice" role="status" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <script type="module">
        import { supabase } from "../js/supabase.js";

        const authForm = document.getElementById("authForm");
        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");
        const nameGroup = document.getElementById("nameGroup");
        const fullName = document.getElementById("fullName");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const submitButton = document.getElementById("submitButton");
        const authMessage = document.getElementById("authMessage");
        const formTitle = document.getElementById("formTitle");
        const formDescription = document.getElementById("formDescription");

        let mode = "login";

        function showMessage(message, type = "error") {
            authMessage.textContent = message;
            authMessage.className = `notice notice-${type}`;
        }

        function setMode(nextMode) {
            mode = nextMode;
            const registering = mode === "register";

            nameGroup.hidden = !registering;
            fullName.required = registering;
            password.autocomplete = registering ? "new-password" : "current-password";
            submitButton.textContent = registering ? "Buat Akun" : "Masuk";
            formTitle.textContent = registering ? "Buat akun baru" : "Selamat datang!";
            formDescription.textContent = registering
                ? "Daftar untuk mulai menyimpan perkembanganmu."
                : "Masuk untuk melanjutkan perjalananmu.";
            authMessage.textContent = "";
            authMessage.className = "notice";
        }

        loginTab.addEventListener("click", (event) => {
            event.preventDefault();
            setMode("login");
        });

        registerTab.addEventListener("click", (event) => {
            event.preventDefault();
            setMode("register");
        });

        async function redirectIfLoggedIn() {
            const { data, error } = await supabase.auth.getSession();

            if (!error && data.session) {
                window.location.replace("./dashboard.html");
            }
        }

        await redirectIfLoggedIn();

        authForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            submitButton.disabled = true;
            submitButton.textContent = "Memproses...";
            authMessage.textContent = "";

            try {
                const userEmail = email.value.trim();
                const userPassword = password.value;

                if (mode === "register") {
                    const { data, error } = await supabase.auth.signUp({
                        email: userEmail,
                        password: userPassword,
                        options: {
                            data: {
                                full_name: fullName.value.trim()
                            }
                        }
                    });

                    if (error) throw error;

                    if (data.session) {
                        window.location.replace("./dashboard.html");
                        return;
                    }

                    showMessage(
                        "Pendaftaran berhasil dikirim. Periksa email untuk verifikasi, lalu masuk setelah akun terverifikasi.",
                        "success"
                    );
                } else {
                    const { error } = await supabase.auth.signInWithPassword({
                        email: userEmail,
                        password: userPassword
                    });

                    if (error) throw error;

                    window.location.replace("./dashboard.html");
                    return;
                }
            } catch (error) {
                showMessage(error.message || "Terjadi kesalahan. Coba lagi.");
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = mode === "register" ? "Buat Akun" : "Masuk";
            }
        });
    </script>
</body>
</html>
